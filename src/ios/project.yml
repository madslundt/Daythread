name: Daythread
options:
  bundleIdPrefix: com.daythread
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
packages:
  OmiCore:
    path: .
targets:
  Daythread:
    type: application
    platform: iOS
    sources: [DaythreadApp]
    dependencies:
      - package: OmiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daythread.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QK69VT259D
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
    info:
      path: DaythreadApp/Info.plist
      properties:
        CFBundleDisplayName: Daythread
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: Daythread connects to your pendant to save audio and button hints on your iPhone and home-core.
        NSLocalNetworkUsageDescription: Daythread sends recordings to your own home-core on your local network.
        NSRemindersFullAccessUsageDescription: Daythread adds a decision follow-up to your default Reminders list only when you tap Save to Reminders.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [bluetooth-central, audio, processing, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.daythread.sync]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
schemes:
  Daythread:
    build:
      targets:
        Daythread: all
