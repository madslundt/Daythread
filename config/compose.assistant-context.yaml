# This rollout installs the provider code but keeps its export disabled until
# the selected profile is explicitly confirmed as personal-only.
services:
  backend:
    environment:
      OMI_ASSISTANT_CONTEXT_ENABLED: "false"
      OMI_ASSISTANT_CONTEXT_PROFILE_ID: default
      OMI_ASSISTANT_CONTEXT_DOMAIN: ""
      OMI_ASSISTANT_CONTEXT_TOKEN_FILE: /run/secrets/daythread-assistant-context-token
    volumes:
      - type: bind
        source: /etc/homecompute/daythread-assistant-context-token
        target: /run/secrets/daythread-assistant-context-token
        read_only: true
        bind:
          create_host_path: false
