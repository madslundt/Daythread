[project]
name = "omi-local"
version = "0.2.0"
description = "Local audio memory backend for an Omi phone companion"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.143.3,<1",
    "httpx[http2]>=0.28.1,<1",
    "pyjwt[crypto]>=2.10.1,<3",
    "langdetect==1.0.9",
    "pydantic-settings>=2.16.0,<3",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0,<1",
    "webrtcvad-wheels==2.0.14",
]

[dependency-groups]
dev = ["httpx2>=2.13.1,<3", "pytest>=9.1.1,<10", "ruff>=0.17.1,<1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/omi_local/web/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/omi_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
required-version = ">=0.13.1"
