name: Daythread
options:
  bundleIdPrefix: com.daythread
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "17.0"
packages:
  OmiCore:
    path: .
targets:
  Daythread:
    type: application
    platform: iOS
    sources: [DaythreadApp]
    dependencies:
      - package: OmiCore
      - target: DaythreadShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daythread.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: DaythreadApp/Daythread.entitlements
        DEVELOPMENT_TEAM: QK69VT259D
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: DaythreadApp/Info.plist
      properties:
        CFBundleDisplayName: Daythread
        CFBundleURLTypes:
          - CFBundleURLName: com.daythread.app
            CFBundleURLSchemes: [daythread]
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mpeg-4-audio, public.mp3, com.microsoft.waveform-audio, org.xiph.flac, com.microsoft.windows-media-wma]
        DaythreadManagedServiceURL: https://app.daythread.elcc.dk
        APNSEnvironment: $(APS_ENVIRONMENT)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: Daythread connects to your pendant to save audio and button hints on your iPhone and home-core.
        NSLocationWhenInUseUsageDescription: Daythread uses your location to tag conversations when enabled and to choose a place for nearby reminders.
        NSLocalNetworkUsageDescription: Daythread sends recordings to your own home-core on your local network.
        NSMicrophoneUsageDescription: Daythread records audio when you start manually or enable a recording schedule. You choose when to upload or remove recordings.
        NSRemindersFullAccessUsageDescription: Daythread adds a decision follow-up to your default Reminders list only when you tap Save to Reminders.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            daythread.home.arpa:
              NSExceptionAllowsInsecureHTTPLoads: true
        UIBackgroundModes: [bluetooth-central, audio, processing, fetch, location]
        BGTaskSchedulerPermittedIdentifiers: [com.daythread.sync]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  DaythreadShare:
    type: app-extension
    platform: iOS
    sources: [DaythreadShare]
    dependencies:
      - package: OmiCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daythread.app.share
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: DaythreadShare/DaythreadShare.entitlements
        DEVELOPMENT_TEAM: QK69VT259D
        APPLICATION_EXTENSION_API_ONLY: true
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    info:
      path: DaythreadShare/Info.plist
      properties:
        CFBundleDisplayName: Daythread
        NSLocationWhenInUseUsageDescription: Daythread uses your current location only if you choose to add it to a shared recording.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            daythread.home.arpa:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio").@count > 0).@count > 0'
schemes:
  Daythread:
    build:
      targets:
        Daythread: all
