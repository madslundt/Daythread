# The owner confirmed the default Daythread profile contains personal/household
# data only; authentication and fixed-profile admission remain mandatory.
services:
  backend:
    environment:
      OMI_ASSISTANT_CONTEXT_ENABLED: "true"
      OMI_ASSISTANT_CONTEXT_PROFILE_ID: default
      OMI_ASSISTANT_CONTEXT_DOMAIN: personal
      OMI_ASSISTANT_CONTEXT_TOKEN_FILE: /run/secrets/daythread-assistant-context-token
    volumes:
      - type: bind
        source: /etc/homecompute/daythread-assistant-context-token
        target: /run/secrets/daythread-assistant-context-token
        read_only: true
        bind:
          create_host_path: false
