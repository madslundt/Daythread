name: omi-local
services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      OMI_DATA_DIR: /data
    ports:
      - "${OMI_BIND_ADDRESS:-0.0.0.0}:8787:8787"
    volumes:
      - omi-data:/data
    restart: unless-stopped
    read_only: true
    # Archive exports stage on /data/.exports, not this small scratch tmpfs.
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  omi-data:
