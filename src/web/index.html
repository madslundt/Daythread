<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#25292c" />
    <script>
      {
        let preference = "system";
        try { preference = localStorage.getItem("omi:appearance:v1") || "system"; } catch {}
        const theme = preference === "light" || preference === "dark" ? preference
          : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#171c21" : "#f7f5f0";
      }
    </script>
    <meta name="description" content="Your private audio memory, on your own home server." />
    <meta name="apple-mobile-web-app-title" content="Daythread" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/daythread-32.png?v=daythread-d-20261017" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/daythread-192.png?v=daythread-d-20261017" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=daythread-d-20261017" />
    <link rel="manifest" href="/site.webmanifest?v=daythread-d-20261017" />
    <title>Daythread</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
